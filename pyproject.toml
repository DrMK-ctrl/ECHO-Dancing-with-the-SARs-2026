[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-sar-investigation"
version = "0.1.0"
description = "Evidence-aware investigation of Earth-surface change in SAR observations"
requires-python = ">=3.11"
dependencies = [
  "asf_search==14.1.0",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
include = ["echo*"]

[tool.setuptools.package-data]
echo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
